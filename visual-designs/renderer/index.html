<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Stockmok visual renderer</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app" data-render-status="loading" aria-live="polite">
      <main class="renderer-loading" aria-busy="true">
        <span class="renderer-loading__bar"></span>
        <span class="renderer-loading__bar renderer-loading__bar--short"></span>
      </main>
    </div>
    <noscript>This visual renderer requires JavaScript.</noscript>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
